- defaults:
    link:
      relink: true
      create: true

- clean:
    - "~"
    - "~/.config"

- link:
    ~/.tmux.conf: tmux.conf
    ~/.oh-my-zsh/custom/.aliases.zsh: aliases.zsh
    ~/.config/ghostty/config: ghostty.conf
    ~/Library/Application Support/Code/User/settings.json: vscodesettings.json
    ~/.ack: ack
    ~/.ag: ag
